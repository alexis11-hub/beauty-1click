<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一键美颜</title>
<style>
:root{
  --ink:#17171c; --ink2:#5c5c68; --ink3:#9a9aa6;
  --line:#e5e5eb; --bg:#f1f1f4; --card:#fff;
  --accent:#e2536c; --accent-d:#c33f57;
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; display:flex; flex-direction:column; overflow:hidden;
  background:var(--bg); color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none}

/* ---------- header ---------- */
header{
  flex:0 0 58px; display:flex; align-items:center; gap:12px; padding:0 20px;
  background:var(--card); border-bottom:1px solid var(--line); z-index:5;
}
.logo{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:650; letter-spacing:.2px}
.logo i{
  width:22px; height:22px; border-radius:50%; display:block;
  background:radial-gradient(circle at 32% 28%, #ffc2ce, #e2536c 62%, #a8364c);
  box-shadow:0 2px 8px rgba(226,83,108,.45);
}
.spacer{flex:1}
.tag{font-size:12px; color:var(--ink3); border:1px solid var(--line); border-radius:100px; padding:3px 10px; white-space:nowrap}
.btn-upload{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:550;
  padding:7px 14px; border-radius:9px; background:#f4f4f7; border:1px solid var(--line);
  transition:.15s;
}
.btn-upload:hover{background:#ececf1}

/* ---------- layout ---------- */
main{flex:1; min-height:0; display:grid; grid-template-columns:1fr 340px}
.stage{
  position:relative; display:flex; align-items:center; justify-content:center; padding:26px; overflow:hidden;
  background-color:#eeeef2;
  background-image:
    linear-gradient(45deg,#e5e5ea 25%,transparent 25%,transparent 75%,#e5e5ea 75%),
    linear-gradient(45deg,#e5e5ea 25%,transparent 25%,transparent 75%,#e5e5ea 75%);
  background-size:22px 22px; background-position:0 0,11px 11px;
}
.drop{
  width:min(520px,100%); aspect-ratio:4/3; border-radius:20px;
  border:2px dashed #cfcfd8; background:rgba(255,255,255,.55);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  color:var(--ink2); cursor:pointer; transition:.18s; text-align:center; padding:24px;
}
.drop:hover,.drop.hot{border-color:var(--accent); background:#fff; transform:translateY(-1px)}
.drop svg{width:44px; height:44px; opacity:.65; margin-bottom:6px}
.drop b{font-size:15px; font-weight:600; color:var(--ink)}
.drop small{color:var(--ink3); font-size:12.5px}

.frame[hidden],.drop[hidden]{display:none!important}
.frame{
  position:relative; display:inline-block; line-height:0; max-width:100%;
  border-radius:12px; overflow:hidden; box-shadow:0 12px 40px rgba(20,20,30,.18), 0 2px 6px rgba(20,20,30,.1);
  cursor:ew-resize; touch-action:none;
}
#proc{display:block; max-width:100%; max-height:calc(100vh - 126px); width:auto; height:auto}
#orig{position:absolute; inset:0; width:100%; height:100%; clip-path:inset(0 calc(100% - var(--x,50%)) 0 0)}
.seam{
  position:absolute; top:0; bottom:0; left:var(--x,50%); width:2px; margin-left:-1px;
  background:rgba(255,255,255,.95); box-shadow:0 0 0 1px rgba(0,0,0,.10); pointer-events:none;
}
.seam::after{
  content:""; position:absolute; top:50%; left:50%; width:28px; height:28px; margin:-14px 0 0 -14px;
  border-radius:50%; background:rgba(255,255,255,.96); box-shadow:0 2px 8px rgba(0,0,0,.28);
}
.seam::before{
  content:"‹ ›"; position:absolute; top:50%; left:50%; transform:translate(-50%,-52%);
  font-size:13px; color:#55555f; letter-spacing:1px; z-index:2;
}
.lbl{
  position:absolute; top:10px; font-size:11.5px; letter-spacing:.4px; padding:3px 9px; border-radius:100px;
  background:rgba(18,18,24,.55); color:#fff; backdrop-filter:blur(6px); pointer-events:none;
}
.lbl.a{left:10px}
.lbl.b{right:10px}

/* ---------- panel ---------- */
aside{
  background:var(--card); border-left:1px solid var(--line); padding:18px 18px 22px;
  overflow-y:auto; display:flex; flex-direction:column; gap:18px;
}
.primary{
  width:100%; padding:13px; border-radius:11px; font-size:14.5px; font-weight:650; color:#fff;
  background:linear-gradient(135deg,#ef6a80,#d94560); box-shadow:0 6px 18px rgba(210,60,90,.28);
  transition:.15s;
}
.primary:hover{filter:brightness(1.04); transform:translateY(-1px)}
.primary:active{transform:none}
.primary:disabled{opacity:.45; box-shadow:none; cursor:default; transform:none}
.hint{font-size:12.5px; color:var(--ink3); margin:-10px 2px 0; line-height:1.55}

.group{display:flex; flex-direction:column; gap:14px}
.ctl.disabled{opacity:.4; pointer-events:none}
.row{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px}
.row label{font-size:13px; color:var(--ink2); font-weight:550}
.row .val{font-size:12px; color:var(--ink3); font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:4px; outline:none;
  background:#e8e8ee;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:#fff;
  border:1.5px solid #d7d7e0; box-shadow:0 1px 4px rgba(0,0,0,.18); cursor:pointer; transition:.15s;
}
input[type=range]::-webkit-slider-thumb:hover{border-color:var(--accent)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:1.5px solid #d7d7e0;box-shadow:0 1px 4px rgba(0,0,0,.18);cursor:pointer}

.sec-title{font-size:12px; color:var(--ink3); letter-spacing:.6px; text-transform:uppercase; font-weight:600}
.chips{display:grid; grid-template-columns:repeat(3,1fr); gap:7px}
.chip{
  padding:8px 4px; border-radius:9px; font-size:12.5px; color:var(--ink2);
  background:#f5f5f8; border:1px solid transparent; transition:.15s; white-space:nowrap;
}
.chip:hover{background:#ededf2}
.chip.on{background:#fdeef1; border-color:#f0c2cc; color:var(--accent-d); font-weight:600}

.actions{display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:auto}
.ghost{
  padding:11px 16px; border-radius:10px; font-size:13.5px; font-weight:550;
  background:#f5f5f8; border:1px solid var(--line); transition:.15s;
}
.ghost:hover{background:#ececf1}
.ghost:disabled{opacity:.45; cursor:default}
.meta{font-size:11.5px; color:var(--ink3); text-align:center; font-variant-numeric:tabular-nums; min-height:16px}

/* ---------- responsive ---------- */
@media (max-width:860px){
  main{grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto}
  aside{border-left:none; border-top:1px solid var(--line); max-height:46vh; gap:14px; padding:14px}
  .stage{padding:14px}
  #proc{max-height:calc(52vh - 60px)}
  .actions{position:sticky; bottom:-10px; margin:0 -14px; padding:10px 14px 14px; background:var(--card); box-shadow:0 -10px 14px -10px rgba(0,0,0,.18)}
}
</style>
</head>
<body>

<header>
  <div class="logo"><i></i>一键美颜</div>
  <div class="spacer"></div>
  <span class="tag">纯本地处理 · 不上传</span>
  <button class="btn-upload" id="pickBtn">上传照片</button>
</header>

<main>
  <section class="stage" id="stage">
    <div class="drop" id="drop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16.5V19a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2.5"/>
        <path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/>
        <circle cx="12" cy="9" r="8.4" opacity=".18"/>
      </svg>
      <b>拖入照片，或点击选择</b>
      <small>支持 JPG / PNG / WebP，也可以 Ctrl+V 粘贴</small>
    </div>
    <div class="frame" id="frame" hidden>
      <canvas id="proc"></canvas>
      <canvas id="orig"></canvas>
      <div class="lbl a">原图</div>
      <div class="lbl b">美颜</div>
      <div class="seam" id="seam"></div>
    </div>
  </section>

  <aside>
    <button class="primary" id="autoBtn" disabled>一键美颜</button>
    <p class="hint" id="hint">导入照片后自动完成磨皮、美白、气色，再按喜好微调。</p>

    <div class="group ctl disabled" id="controls">
      <div>
        <div class="row"><label for="smooth">磨皮</label><span class="val" id="v-smooth">0</span></div>
        <input type="range" id="smooth" min="0" max="100" value="0" step="1">
      </div>
      <div>
        <div class="row"><label for="white">美白</label><span class="val" id="v-white">0</span></div>
        <input type="range" id="white" min="0" max="100" value="0" step="1">
      </div>
      <div>
        <div class="row"><label for="blush">气色</label><span class="val" id="v-blush">0</span></div>
        <input type="range" id="blush" min="0" max="100" value="0" step="1">
      </div>
      <div>
        <div class="row"><label for="sharpen">锐化</label><span class="val" id="v-sharpen">0</span></div>
        <input type="range" id="sharpen" min="0" max="100" value="0" step="1">
      </div>
    </div>

    <div class="group ctl disabled" id="filterBox">
      <div class="sec-title">滤镜</div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="actions">
      <button class="ghost" id="dlBtn" disabled>下载</button>
      <button class="ghost" id="resetBtn" disabled>重置</button>
    </div>
    <div class="meta" id="meta"></div>
  </aside>
</main>

<input id="file" type="file" accept="image/*" hidden>

<script>
"use strict";

/* ==================== CORE:START (纯算法，不碰 DOM) ==================== */

function clamp01(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }

function smoothstep(a, b, v){
  if (a === b) return v < a ? 0 : 1;
  const t = clamp01((v - a) / (b - a));
  return t * t * (3 - 2 * t);
}

/* 可分离盒式模糊（均值模糊），边缘复制。src: RGBA Uint8ClampedArray */
function boxBlurRGBA(src, W, H, r){
  const tmp = new Float32Array(W * H * 3);
  const out = new Float32Array(W * H * 3);
  const win = 2 * r + 1;
  for (let y = 0; y < H; y++){
    const row = y * W;
    let sr = 0, sg = 0, sb = 0;
    for (let k = -r; k <= r; k++){
      const x = k < 0 ? 0 : (k > W - 1 ? W - 1 : k), i = (row + x) * 4;
      sr += src[i]; sg += src[i+1]; sb += src[i+2];
    }
    for (let x = 0; x < W; x++){
      const o = (row + x) * 3;
      tmp[o] = sr / win; tmp[o+1] = sg / win; tmp[o+2] = sb / win;
      const xa = Math.min(W - 1, x + r + 1), xr = Math.max(0, x - r);
      const ia = (row + xa) * 4, ir = (row + xr) * 4;
      sr += src[ia] - src[ir];
      sg += src[ia+1] - src[ir+1];
      sb += src[ia+2] - src[ir+2];
    }
  }
  for (let x = 0; x < W; x++){
    let sr = 0, sg = 0, sb = 0;
    for (let k = -r; k <= r; k++){
      const y = k < 0 ? 0 : (k > H - 1 ? H - 1 : k), o = (y * W + x) * 3;
      sr += tmp[o]; sg += tmp[o+1]; sb += tmp[o+2];
    }
    for (let y = 0; y < H; y++){
      const o = (y * W + x) * 3;
      out[o] = sr / win; out[o+1] = sg / win; out[o+2] = sb / win;
      const ya = Math.min(H - 1, y + r + 1), yr = Math.max(0, y - r);
      const oa = (ya * W + x) * 3, orr = (yr * W + x) * 3;
      sr += tmp[oa] - tmp[orr];
      sg += tmp[oa+1] - tmp[orr+1];
      sb += tmp[oa+2] - tmp[orr+2];
    }
  }
  return out;
}

/* 单通道浮点图模糊 */
function boxBlurF(src, W, H, r){
  const tmp = new Float32Array(W * H);
  const out = new Float32Array(W * H);
  const win = 2 * r + 1;
  for (let y = 0; y < H; y++){
    const row = y * W;
    let s = 0;
    for (let k = -r; k <= r; k++){
      const x = k < 0 ? 0 : (k > W - 1 ? W - 1 : k);
      s += src[row + x];
    }
    for (let x = 0; x < W; x++){
      tmp[row + x] = s / win;
      const xa = Math.min(W - 1, x + r + 1), xr = Math.max(0, x - r);
      s += src[row + xa] - src[row + xr];
    }
  }
  for (let x = 0; x < W; x++){
    let s = 0;
    for (let k = -r; k <= r; k++){
      const y = k < 0 ? 0 : (k > H - 1 ? H - 1 : k);
      s += tmp[y * W + x];
    }
    for (let y = 0; y < H; y++){
      out[y * W + x] = s / win;
      const ya = Math.min(H - 1, y + r + 1), yr = Math.max(0, y - r);
      s += tmp[ya * W + x] - tmp[yr * W + x];
    }
  }
  return out;
}

/* YCbCr 肤色权重 0..1 */
function skinWeight(r, g, b){
  const y  = 0.299 * r + 0.587 * g + 0.114 * b;
  const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
  const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
  let w = smoothstep(128, 141, cr) * (1 - smoothstep(170, 190, cr));
  w *= smoothstep(68, 82, cb) * (1 - smoothstep(124, 140, cb));
  w *= smoothstep(28, 62, y);
  return w;
}

function buildMask(src, W, H){
  const n = W * H, m = new Float32Array(n);
  for (let i = 0, p = 0; p < n; p++, i += 4) m[p] = skinWeight(src[i], src[i+1], src[i+2]);
  return boxBlurF(m, W, H, Math.max(3, Math.round(Math.min(W, H) / 150)));
}

/* 单通道色调 LUT */
function buildLUT(gamma, contrast, gain, lift){
  const L = new Float32Array(256);
  for (let v = 0; v < 256; v++){
    let x = Math.pow(v / 255, gamma);
    x = (x - 0.5) * contrast + 0.5;
    x = x * gain + lift / 255;
    L[v] = x <= 0 ? 0 : x >= 1 ? 255 : x * 255;
  }
  return L;
}

const FILTER_DEFS = {
  none:    { name: '原图', sat: 1,    g: null },
  clear:   { name: '清透', sat: 1.00, g: { gamma: 0.972, contrast: 1.03, gain: [1.005, 1.000, 1.020], lift: [2, 2, 5] } },
  vital:   { name: '元气', sat: 1.10, g: { gamma: 0.982, contrast: 1.06, gain: [1.045, 1.005, 0.975], lift: [4, 2, 0] } },
  cool:    { name: '冷白', sat: 0.90, g: { gamma: 0.955, contrast: 1.02, gain: [0.995, 1.005, 1.055], lift: [2, 3, 5] } },
  soft:    { name: '柔光', sat: 0.96, g: { gamma: 1.000, contrast: 0.93, gain: [1.010, 1.000, 1.010], lift: [10, 7, 12] } },
  mono:    { name: '黑白', sat: 0.00, g: { gamma: 1.000, contrast: 1.12, gain: [1, 1, 1], lift: [0, 0, 0] } }
};

function buildFilterLUTs(key){
  const d = FILTER_DEFS[key];
  if (!d || !d.g) return null;
  const g = d.g;
  return {
    rLUT: buildLUT(g.gamma, g.contrast, g.gain[0], g.lift[0]),
    gLUT: buildLUT(g.gamma, g.contrast, g.gain[1], g.lift[1]),
    bLUT: buildLUT(g.gamma, g.contrast, g.gain[2], g.lift[2]),
    sat: d.sat
  };
}

/* 主渲染：返回新的 RGBA 数据 */
function renderPixels(src, W, H, p, blur, mask, fx){
  const out = new Uint8ClampedArray(src);
  const n = W * H;
  const sm = p.smooth / 100, wh = p.white / 100, bl = p.blush / 100, sh = p.sharpen / 100;
  const rL = fx ? fx.rLUT : null, gL = fx ? fx.gLUT : null, bL = fx ? fx.bLUT : null;
  const sat = fx ? fx.sat : 1;

  for (let idx = 0, i = 0; idx < n; idx++, i += 4){
    let r = out[i], g = out[i+1], b = out[i+2];
    const m = mask[idx];
    const br = blur[idx*3], bg = blur[idx*3+1], bb = blur[idx*3+2];
    let ws = 0;

    if (m > 0.02){
      /* 1. 磨皮：平坦皮肤强模糊，边缘/五官细节保留 */
      if (sm > 0){
        const d1 = r > br ? r - br : br - r;
        const d2 = g > bg ? g - bg : bg - g;
        const d3 = b > bb ? b - bb : bb - b;
        const diff = d1 > d2 ? (d1 > d3 ? d1 : d3) : (d2 > d3 ? d2 : d3);
        const edge = diff <= 22 ? 0 : diff >= 70 ? 1 : (diff - 22) / 48;
        ws = sm * m * (1 - edge) * 0.97;
        r += (br - r) * ws;
        g += (bg - g) * ws;
        b += (bb - b) * ws;
      }
      /* 2. 美白：提亮 + 轻微降饱和 */
      if (wh > 0){
        const t = wh * m, lift = 0.26 * t;
        r += (255 - r) * lift; g += (255 - g) * lift; b += (255 - b) * lift;
        const l = 0.299*r + 0.587*g + 0.114*b, ds = 0.18 * t;
        r += (l - r) * ds; g += (l - g) * ds; b += (l - b) * ds;
      }
      /* 3. 气色：皮肤区补一点血色 */
      if (bl > 0){
        const t = bl * m;
        r += 11 * t; g += 3.4 * t; b -= 2.2 * t;
      }
    }

    /* 4. 锐化：只加在没被磨平的细节上 */
    if (sh > 0){
      const k = sh * (1 - ws) * 0.55;
      r += (r - br) * k; g += (g - bg) * k; b += (b - bb) * k;
    }

    /* 5. 滤镜 */
    if (rL){
      let R = r < 0 ? 0 : r > 255 ? 255 : r;
      let G = g < 0 ? 0 : g > 255 ? 255 : g;
      let B = b < 0 ? 0 : b > 255 ? 255 : b;
      R = rL[R | 0]; G = gL[G | 0]; B = bL[B | 0];
      if (sat !== 1){
        const l = 0.299*R + 0.587*G + 0.114*B;
        R = l + (R - l) * sat; G = l + (G - l) * sat; B = l + (B - l) * sat;
      }
      out[i] = R; out[i+1] = G; out[i+2] = B;
    } else {
      out[i] = r; out[i+1] = g; out[i+2] = b;
    }
  }
  return out;
}

/* ==================== CORE:END ==================== */

/* ---------------- UI ---------------- */
const $ = s => document.querySelector(s);
const MAX_SIDE = 1600;

const els = {
  stage: $('#stage'), drop: $('#drop'), frame: $('#frame'),
  proc: $('#proc'), orig: $('#orig'), seam: $('#seam'),
  file: $('#file'), pick: $('#pickBtn'),
  auto: $('#autoBtn'), reset: $('#resetBtn'), dl: $('#dlBtn'),
  controls: $('#controls'), filterBox: $('#filterBox'),
  chips: $('#chips'), meta: $('#meta'), hint: $('#hint'),
  vals: { smooth: $('#v-smooth'), white: $('#v-white'), blush: $('#v-blush'), sharpen: $('#v-sharpen') },
  ranges: { smooth: $('#smooth'), white: $('#white'), blush: $('#blush'), sharpen: $('#sharpen') }
};

const pctx = els.proc.getContext('2d', { willReadFrequently: true });
const octx = els.orig.getContext('2d', { willReadFrequently: true });

const AUTO = { smooth: 72, white: 40, blush: 28, sharpen: 22, filter: 'clear' };
const state = { smooth: 0, white: 0, blush: 0, sharpen: 0, filter: 'none' };

let W = 0, H = 0, srcData = null, blurData = null, mask = null;
let fxCache = {}, loaded = false, raf = 0, lastMs = 0;

/* 滤镜按钮 */
for (const key of Object.keys(FILTER_DEFS)){
  const b = document.createElement('button');
  b.className = 'chip' + (key === 'none' ? ' on' : '');
  b.textContent = FILTER_DEFS[key].name;
  b.dataset.filter = key;
  b.onclick = () => {
    state.filter = key;
    [...els.chips.children].forEach(c => c.classList.toggle('on', c.dataset.filter === key));
    schedule();
  };
  els.chips.appendChild(b);
}

/* 滑杆 */
for (const k of ['smooth', 'white', 'blush', 'sharpen']){
  els.ranges[k].addEventListener('input', e => {
    state[k] = +e.target.value;
    els.vals[k].textContent = state[k];
    schedule();
  });
}

els.auto.onclick = () => applyAuto();
els.reset.onclick = () => {
  Object.assign(state, { smooth: 0, white: 0, blush: 0, sharpen: 0, filter: 'none' });
  syncUI();
  schedule();
};

function applyAuto(){
  if (!loaded) return;
  Object.assign(state, AUTO);
  syncUI();
  schedule();
}

function syncUI(){
  for (const k of ['smooth', 'white', 'blush', 'sharpen']){
    els.ranges[k].value = state[k];
    els.vals[k].textContent = state[k];
  }
  [...els.chips.children].forEach(c => c.classList.toggle('on', c.dataset.filter === state.filter));
}

function schedule(){
  if (raf) return;
  raf = requestAnimationFrame(() => { raf = 0; render(); });
}

function analyze(){
  const r = Math.max(3, Math.round(Math.min(W, H) / 105));
  blurData = boxBlurRGBA(srcData, W, H, r);
  mask = buildMask(srcData, W, H);
}

function render(){
  if (!loaded) return;
  const t0 = performance.now();
  if (!fxCache[state.filter]) fxCache[state.filter] = buildFilterLUTs(state.filter);
  const out = renderPixels(srcData, W, H, state, blurData, mask, fxCache[state.filter]);
  const img = new ImageData(out, W, H);
  pctx.putImageData(img, 0, 0);
  lastMs = Math.round(performance.now() - t0);
  els.meta.textContent = `${W} × ${H} · 处理 ${lastMs} ms`;
}

/* 载入图片 */
async function loadFile(file){
  if (!file || !file.type.startsWith('image/')) return;
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e){
    bitmap = await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
  const scale = Math.min(1, MAX_SIDE / Math.max(bitmap.width, bitmap.height));
  W = Math.max(1, Math.round(bitmap.width * scale));
  H = Math.max(1, Math.round(bitmap.height * scale));

  const tmp = document.createElement('canvas');
  tmp.width = W; tmp.height = H;
  const tctx = tmp.getContext('2d', { willReadFrequently: true });
  tctx.drawImage(bitmap, 0, 0, W, H);
  const id = tctx.getImageData(0, 0, W, H);
  srcData = id.data;

  els.proc.width = W; els.proc.height = H;
  els.orig.width = W; els.orig.height = H;
  octx.putImageData(id, 0, 0);
  pctx.putImageData(id, 0, 0);

  els.drop.hidden = true;
  els.frame.hidden = false;
  setSplit(50);

  analyze();
  loaded = true;
  fxCache = {};
  els.auto.disabled = false;
  els.dl.disabled = false;
  els.reset.disabled = false;
  els.controls.classList.remove('disabled');
  els.filterBox.classList.remove('disabled');
  els.hint.textContent = '已自动套用一键美颜。拖动图片中间的分割线可对比前后。';

  applyAuto();

  if (bitmap.close) bitmap.close();
}

/* 分割线拖动 */
let dragging = false;
function setSplit(pct){
  els.frame.style.setProperty('--x', Math.max(0, Math.min(100, pct)) + '%');
}
function pointerMove(e){
  const r = els.frame.getBoundingClientRect();
  setSplit((e.clientX - r.left) / r.width * 100);
}
els.frame.addEventListener('pointerdown', e => {
  dragging = true;
  els.frame.setPointerCapture(e.pointerId);
  pointerMove(e);
});
els.frame.addEventListener('pointermove', e => { if (dragging) pointerMove(e); });
els.frame.addEventListener('pointerup', () => { dragging = false; });
els.frame.addEventListener('pointercancel', () => { dragging = false; });

/* 上传入口 */
els.pick.onclick = () => els.file.click();
els.drop.onclick = () => els.file.click();
els.file.onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); };

['dragenter', 'dragover'].forEach(t => els.stage.addEventListener(t, e => {
  e.preventDefault(); els.drop.classList.add('hot');
}));
['dragleave', 'drop'].forEach(t => els.stage.addEventListener(t, e => {
  e.preventDefault(); els.drop.classList.remove('hot');
}));
els.stage.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
window.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items){
    if (it.type.startsWith('image/')){
      const f = it.getAsFile();
      if (f) { loadFile(f); break; }
    }
  }
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());

/* 下载 */
els.dl.onclick = () => {
  if (!loaded) return;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(els.proc, 0, 0);
  c.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `美颜_${Date.now()}.jpg`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/jpeg', 0.94);
};

/* 窗口尺寸变化时重设分割线不需要处理，CSS 自适应 */
</script>
</body>
</html>
